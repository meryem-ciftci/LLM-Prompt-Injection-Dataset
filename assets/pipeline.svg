<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-labelledby="t d">
  <title id="t">Generator 3 pipeline</title>
  <desc id="d">Licensed carriers and QC-approved attack components are assembled into a deterministic release, which feeds target-model and detector evaluation.</desc>
  <style>
    .box{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.2}
    .hl{fill:#ddf4ff;stroke:#54aeff}
    .ev{fill:#fff8c5;stroke:#d4a72c}
    .t{font:600 13px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#1f2328}
    .s{font:11.5px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#59636e}
    .k{font:600 11px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#59636e;letter-spacing:.06em}
    .ln{stroke:#8c959f;stroke-width:1.4;fill:none}
    @media (prefers-color-scheme: dark){
      .box{fill:#161b22;stroke:#30363d}.hl{fill:#0c2d6b;stroke:#1f6feb}.ev{fill:#3b2e00;stroke:#9e6a03}
      .t{fill:#e6edf3}.s,.k{fill:#9198a1}.ln{stroke:#6e7681}
    }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>

  <text class="k" x="20" y="22">CARRIERS</text>
  <rect class="box" x="20" y="32" width="190" height="62" rx="8"/>
  <text class="t" x="34" y="56">Licensed sources</text>
  <text class="s" x="34" y="76">SPDX gate · SHA-256 pins</text>
  <path class="ln" d="M210 63 L238 63" marker-end="url(#a)"/>
  <rect class="box" x="240" y="32" width="190" height="62" rx="8"/>
  <text class="t" x="254" y="56">Length windows</text>
  <text class="s" x="254" y="76">real neighbouring text</text>

  <text class="k" x="20" y="132">ATTACK COMPONENTS</text>
  <rect class="box" x="20" y="142" width="190" height="62" rx="8"/>
  <text class="t" x="34" y="166">Local model proposals</text>
  <text class="s" x="34" y="186">goal × technique × language</text>
  <path class="ln" d="M210 173 L238 173" marker-end="url(#a)"/>
  <rect class="box" x="240" y="142" width="190" height="62" rx="8"/>
  <text class="t" x="254" y="166">Automatic QC</text>
  <text class="s" x="254" y="186">rules · independent judge · dedup</text>

  <path class="ln" d="M430 63 C 465 63 465 118 492 118" marker-end="url(#a)"/>
  <path class="ln" d="M430 173 C 465 173 465 118 492 118" marker-end="url(#a)"/>
  <rect class="box hl" x="494" y="84" width="170" height="68" rx="8"/>
  <text class="t" x="508" y="108">Deterministic release</text>
  <text class="s" x="508" y="128">split-disjoint · manifest</text>
  <text class="s" x="508" y="144">Croissant · data card</text>

  <path class="ln" d="M664 118 C 690 118 690 63 712 63" marker-end="url(#a)"/>
  <path class="ln" d="M664 118 C 690 118 690 173 712 173" marker-end="url(#a)"/>
  <rect class="box ev" x="714" y="32" width="146" height="62" rx="8"/>
  <text class="t" x="728" y="56">Target models</text>
  <text class="s" x="728" y="76">ASR · MR · utility</text>
  <rect class="box ev" x="714" y="142" width="146" height="62" rx="8"/>
  <text class="t" x="728" y="166">Detectors</text>
  <text class="s" x="728" y="186">P / R / F1 · span IoU</text>
</svg>
