services:
  ollama:
    image: ollama/ollama:0.40.16
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  evaluator:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./data:/workspace/data
      - ./evaluation:/workspace/evaluation
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama-models:

